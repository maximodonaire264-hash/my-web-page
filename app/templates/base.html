<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Trenes{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>[x-cloak]{display:none !important}</style>
</head>
<body class="bg-slate-50 text-slate-800">

  <nav x-data="{ abierto: false }" class="bg-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('main.index') }}" class="font-bold text-lg">🚆 Trenes</a>
      <button @click="abierto = !abierto" class="md:hidden text-2xl">☰</button>
      <div class="hidden md:flex gap-6">
        <a href="{{ url_for('main.index') }}">Inicio</a>
        <a href="{{ url_for('main.catalogo') }}">Catálogo</a>
      </div>
    </div>
    <div x-show="abierto" x-cloak class="md:hidden px-4 pb-3 flex flex-col gap-2">
      <a href="{{ url_for('main.index') }}">Inicio</a>
      <a href="{{ url_for('main.catalogo') }}">Catálogo</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block contenido %}{% endblock %}
  </main>

</body>
</html>
