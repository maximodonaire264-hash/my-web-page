{# Espera una variable `tren`. Se usa en el catálogo, favoritos y la portada. #}
<article class="bg-white border border-tinta/15 flex flex-col">
  {% if tren.imagen %}
    <img src="{{ url_for('static', filename='img/trenes/' ~ tren.imagen) }}" alt="{{ tren.nombre }}"
         loading="lazy" class="aspect-[16/10] w-full object-cover">
  {% else %}
    <div class="aspect-[16/10] bg-tinta/10 grid place-items-center font-display text-2xl text-riel">Sin foto</div>
  {% endif %}

  <div class="p-4 flex-1 flex flex-col gap-2">
    <div class="flex items-start justify-between gap-3">
      <h3 class="font-display text-3xl leading-none">
        <a href="{{ url_for('catalogo.detalle', tren_id=tren.id) }}" class="hover:underline">{{ tren.nombre }}</a>
      </h3>
      <button type="button" @click="$store.favs.toggle({{ tren.id }})"
              :aria-pressed="$store.favs.has({{ tren.id }})"
              :title="$store.favs.has({{ tren.id }}) ? 'Quitar de favoritos' : 'Guardar en favoritos'"
              aria-label="Guardar en favoritos" class="shrink-0 p-1">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
             :fill="$store.favs.has({{ tren.id }}) ? '#C98A1B' : 'none'" aria-hidden="true">
          <path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>
        </svg>
      </button>
    </div>
    <p class="text-riel">{{ tren.tipo }}{% if tren.anio %}, {{ tren.anio }}{% endif %}</p>
    {% if tren.descripcion %}
      <p class="text-sm leading-relaxed">{{ tren.descripcion|truncate(110) }}</p>
    {% endif %}
  </div>
</article>
