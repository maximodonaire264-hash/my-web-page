{% extends 'base.html' %}
{% block title %}Trivia - Trenes argentinos{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl px-4 py-10">
  <h1 class="font-display text-5xl">Trivia</h1>
  <p class="mt-2 text-riel">Preguntas sobre trenes argentinos. Cada respuesta incluye una explicación.</p>

  <div id="quiz" class="mt-8" aria-live="polite">
    <button type="button" hx-get="{{ url_for('quiz.pregunta') }}" hx-target="#quiz"
            class="bg-senal text-tinta font-display text-2xl px-6 py-3">Empezar</button>
  </div>
</div>
{% endblock %}
